services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: training-platform-backend
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://trainings.bluetrail.software/api/auth/oauth/callback}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-bluetrailsoft.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FILE_UPLOAD_PATH: ${FILE_UPLOAD_PATH:-/app/uploads}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
    ports:
      - '8000:8000'
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - training-platform-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: training-platform-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://trainings.bluetrail.software/api}
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - training-platform-network
    restart: unless-stopped

networks:
  training-platform-network:
    driver: bridge
