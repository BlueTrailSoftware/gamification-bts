services:
  database:
    image: postgres:15-alpine
    container_name: training-platform-db
    environment:
      POSTGRES_DB: training_platform
      POSTGRES_USER: training_user
      POSTGRES_PASSWORD: training_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - training-platform-network
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U training_user -d training_platform']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://training_user:training_password@database:5432/training_platform
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CALLBACK_URL: http://localhost:8000/api/auth/oauth/callback

volumes:
  postgres_data:
